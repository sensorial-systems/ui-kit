[package]
name = "ui-kit-wgpu"
version = "0.1.0"
edition = "2021"
[dependencies]
ui-kit-core = { path = "../ui-kit-core" }
ui-kit-immediate = { path = "../ui-kit-immediate" }
prism-ui-render = { git = "https://github.com/sensorial-studio/prism", rev = "ef93eebd1b95d343bf939f1b322907a4e7920ce4" }
# The backends are prism-gpu's (through prism-ui-render): Vulkan and Metal
# natively, WebGPU and WebGL2 in a browser.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
glyphon = "0.12"
anyhow = "1"
bytemuck = "1"
[dev-dependencies]
pollster = "0.4"
