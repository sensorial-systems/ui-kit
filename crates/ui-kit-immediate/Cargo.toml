[package]
name = "ui-kit-immediate"
version = "0.1.0"
edition = "2021"
[dependencies]
ui-kit-core = { path = "../ui-kit-core" }
prism-ui = { git = "https://github.com/sensorial-studio/prism", rev = "be6501e124d2de64e2aabc254ac7088fc532c244" }
serde = { version = "1", features = ["derive"] }
usvg = { version = "0.48.1", default-features = false }
lyon_tessellation = "1.0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
