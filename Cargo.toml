[workspace]
resolver = "3"
members = ["crates/*", "examples/gallery", "examples/shared-gallery", "examples/immediate-gallery", "examples/morph-reel"]

[workspace.package]

# Dependencies are built optimized in development too: text shaping, layout
# and the GPU stack run many times slower unoptimized, and are rarely rebuilt.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
# prism's wgpu-hal: 30.0.1's fixes and its PowerVR change (prism's vendor/README.md).
wgpu-hal = { path = "../../studio/prism/vendor/wgpu-hal" }
